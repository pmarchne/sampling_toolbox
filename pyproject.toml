[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sampling_toolbox"
version = "0.1.0"
description = "A toolbox for sampling methods"
dependencies = [
    "numpy",
    "scipy",
    "tabulate",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sampling_toolbox*"]
